# Portfolio — a static bundle on Cloudflare Workers static assets. No Worker
# script: there is nothing to run, only files to serve. deploy.yml builds
# dist/ with APP_VERSION from the release tag and runs `wrangler deploy`.
name = "portfolio"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
# A one-page site: an unknown path is a 404, not index.html.
not_found_handling = "none"
# Screens and maps are referenced as `/systems/<slug>/<page>.html` from the
# page and iframed with query strings; the default `auto-trailing-slash`
# answered each with a 307 to the extensionless path first. Serve as-is.
html_handling = "none"

# Public hostname on the estate's zone (FOLIO-9). A Workers custom domain:
# wrangler attaches it through the Workers domains API on deploy, and
# Cloudflare creates the proxied DNS record and the certificate itself. The
# deploy token is an Account API token made from Cloudflare's own
# "Edit Cloudflare Workers" template, scoped to this account and to the
# zerogravity.industries zone (FOLIO-8). No tunnel, no Access — public by design.
routes = [{ pattern = "portfolio.zerogravity.industries", custom_domain = true }]
