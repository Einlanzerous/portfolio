name: release

# release-please owns CHANGELOG.md and the version. A `feat:`/`fix:` on main
# opens or updates the release PR; merging it cuts the release, and the
# `deploy` job below ships it in the same run. `chore:` does not release
# (PRINCIPLES §3). Deploy is chained here rather than triggered by the tag
# because it keeps the version in one run and does not depend on a tag push
# starting a second workflow — see deploy.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The release PR must be authored by the release-bot App, not
      # GITHUB_TOKEN: on this public repo GITHUB_TOKEN-authored PRs park their
      # ci / PR Review runs as `action_required` and they end `failure` with
      # no jobs (FOLIO-25). Same setup as amber, purser, switchyard, lyceum.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
