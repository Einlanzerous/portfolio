name: release

# release-please owns CHANGELOG.md and the version. A `feat:`/`fix:` on main
# opens or updates the release PR; merging it cuts the release, and the
# `deploy` job below ships it in the same run. `chore:` does not release
# (PRINCIPLES §3). Deploy is chained here rather than triggered by the tag
# because tags pushed with GITHUB_TOKEN do not start workflows — see
# deploy.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
